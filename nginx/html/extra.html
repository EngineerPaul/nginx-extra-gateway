<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>/extra — сервисы</title>
  <style>
    :root {
      --ink: #1c1917;
      --muted: #78716c;
      --line: #e7e5e4;
      --bg: #fafaf9;
      --card: #ffffff;
      --accent: #0f766e;
      --accent-hover: #0d9488;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #ccfbf1 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 0%, #fef3c7 0%, transparent 45%),
        var(--bg);
    }
    main {
      max-width: 44rem;
      margin: 0 auto;
      padding: 3rem 1.25rem 4rem;
      padding-left: max(1.25rem, env(safe-area-inset-left));
      padding-right: max(1.25rem, env(safe-area-inset-right));
      padding-bottom: max(4rem, env(safe-area-inset-bottom));
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(1.45rem, 4vw + 1rem, 1.75rem);
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .lead {
      margin: 0 0 1.75rem;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgb(28 25 23 / 4%);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }
    th, td {
      padding: 0.85rem 1rem;
      text-align: left;
      vertical-align: middle;
      border-bottom: 1px solid var(--line);
    }
    th {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      background: #f5f5f4;
    }
    tr:last-child td { border-bottom: none; }
    tr.home td { background: #f0fdfa; }
    .name { font-weight: 600; white-space: nowrap; }
    a {
      color: var(--accent);
      text-decoration: none;
      word-break: break-all;
      overflow-wrap: anywhere;
    }
    a:hover { color: var(--accent-hover); text-decoration: underline; }
    code {
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 0.88em;
    }

    @media (max-width: 640px) {
      main {
        padding-top: 1.75rem;
        padding-bottom: max(2.5rem, env(safe-area-inset-bottom));
      }
      .lead { margin-bottom: 1.25rem; }
      .panel { border-radius: 10px; }
      thead { display: none; }
      table, tbody, tr, td { display: block; width: 100%; }
      tr {
        padding: 0.9rem 1rem;
        border-bottom: 1px solid var(--line);
      }
      tr:last-child { border-bottom: none; }
      tr.home { background: #f0fdfa; }
      tr.home td { background: transparent; }
      td {
        padding: 0;
        border: none;
      }
      td.name {
        margin-bottom: 0.35rem;
        white-space: normal;
      }
      td.link a {
        display: block;
        padding: 0.55rem 0;
        line-height: 1.4;
        /* зона нажатия удобнее для пальца */
        min-height: 2.75rem;
      }
      code { font-size: 0.82em; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Extra</h1>
    <p class="lead">Каталог сервисов за префиксом <code>/extra</code>.</p>
    <div class="panel">
      <table>
        <thead>
          <tr>
            <th>Сервис</th>
            <th>Ссылка</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
  <script>
    const DOMAIN = "daystream.ru";
    const origin = `https://${DOMAIN}`;

    const entries = [
      { name: "Главная сайта", path: "/" },
      { name: "Blank", path: "/extra/blank" },
      { name: "Analyses", path: "/extra/analyses/" },
      { name: "Summary", path: "/extra/summary/" },
      { name: "Marketing", path: "/extra/marketing/" },
      { name: "Calendar", path: "/extra/calendar/" },
    ];

    const tbody = document.getElementById("rows");
    for (const entry of entries) {
      const url = origin + entry.path;
      const tr = document.createElement("tr");
      if (entry.path === "/") tr.className = "home";
      tr.innerHTML =
        `<td class="name">${entry.name}</td>` +
        `<td class="link"><a href="${url}"><code>${url}</code></a></td>`;
      tbody.appendChild(tr);
    }
  </script>
</body>
</html>
