<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Android приложения</title>
  <style>
    :root {
      --ink: #1c1917;
      --muted: #78716c;
      --line: #e7e5e4;
      --bg: #fafaf9;
      --card: #ffffff;
      --accent: #0f766e;
      --accent-hover: #0d9488;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #ccfbf1 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 0%, #fef3c7 0%, transparent 45%),
        var(--bg);
    }
    main {
      max-width: 52rem;
      margin: 0 auto;
      padding: 3rem 1.25rem 4rem;
      padding-left: max(1.25rem, env(safe-area-inset-left));
      padding-right: max(1.25rem, env(safe-area-inset-right));
      padding-bottom: max(4rem, env(safe-area-inset-bottom));
    }
    .back {
      margin: 0 0 1.25rem;
      font-size: 0.9rem;
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(1.45rem, 4vw + 1rem, 1.75rem);
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .lead {
      margin: 0 0 1.5rem;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgb(28 25 23 / 4%);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }
    th, td {
      padding: 0.85rem 1rem;
      text-align: left;
      vertical-align: middle;
      border-bottom: 1px solid var(--line);
    }
    th {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      background: #f5f5f4;
    }
    tr:last-child td { border-bottom: none; }
    td.num {
      width: 3.25rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .name { font-weight: 600; }
    .desc {
      color: var(--ink);
      line-height: 1.45;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover { color: var(--accent-hover); text-decoration: underline; }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.5rem;
      padding: 0.4rem 0.95rem;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    a.btn:hover {
      background: var(--accent-hover);
      color: #fff;
      text-decoration: none;
    }
    a.btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .empty {
      margin: 0;
      padding: 1.25rem 1rem;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      main {
        padding-top: 1.75rem;
        padding-bottom: max(2.5rem, env(safe-area-inset-bottom));
      }
      .panel { border-radius: 10px; }
      thead { display: none; }
      table, tbody, tr, td { display: block; width: 100%; }
      tr {
        padding: 1rem;
        border-bottom: 1px solid var(--line);
      }
      tr:last-child { border-bottom: none; }
      td {
        padding: 0;
        border: none;
      }
      td.num {
        width: auto;
        margin-bottom: 0.2rem;
        font-size: 0.75rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      td.name { margin-bottom: 0.35rem; }
      td.desc {
        margin-bottom: 0.9rem;
        color: var(--muted);
      }
      td.dl a.btn { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <p class="back"><a href="/extra/">К каталогу</a></p>
    <h1>Android приложения</h1>
    <p class="lead">APK для установки на телефон. Номер в таблице — порядок строк в списке ниже.</p>
    <div class="panel">
      <table>
        <thead>
          <tr>
            <th>№</th>
            <th>Название</th>
            <th>Описание</th>
            <th>Скачать</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="empty" id="empty" hidden>Пока нет файлов.</p>
    </div>
  </main>
  <script>
    // file — имя файла в nginx/apks/, без пути.
    const apps = [
      {
        name: "Tasks",
        description: "Приложение для управления заметками и напоминаниями.",
        file: "tasks.apk",
      },
    ];

    const tbody = document.getElementById("rows");
    const empty = document.getElementById("empty");
    if (apps.length === 0) {
      empty.hidden = false;
    }
    apps.forEach((app, index) => {
      const tr = document.createElement("tr");

      const tdNum = document.createElement("td");
      tdNum.className = "num";
      tdNum.textContent = String(index + 1);

      const tdName = document.createElement("td");
      tdName.className = "name";
      tdName.textContent = app.name;

      const tdDesc = document.createElement("td");
      tdDesc.className = "desc";
      tdDesc.textContent = app.description;

      const tdDl = document.createElement("td");
      tdDl.className = "dl";
      const link = document.createElement("a");
      link.className = "btn";
      link.href = "files/" + encodeURIComponent(app.file);
      link.download = app.file;
      link.title = app.file;
      link.textContent = "Скачать";
      tdDl.appendChild(link);

      tr.append(tdNum, tdName, tdDesc, tdDl);
      tbody.appendChild(tr);
    });
  </script>
</body>
</html>
