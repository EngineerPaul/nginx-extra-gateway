# Шлюз /extra — раздача подсервисов по продолжению пути.
# Пример: /extra/blank; /extra/analyses; /extra/summary; /extra/marketing; /extra/calendar.

server {
    listen 80;
    server_name _;

    # Заглушка для проверки цепочки: браузер → diary nginx → extra_nginx
    location = /extra/blank {
        default_type text/html;
        alias /usr/share/nginx/html/extra/blank.html;
    }

    location = /extra/blank/ {
        return 301 /extra/blank;
    }

    include /etc/nginx/conf.d/analyses.conf;
    include /etc/nginx/conf.d/summary.conf;
    include /etc/nginx/conf.d/marketing.conf;
    include /etc/nginx/conf.d/calendar.conf;

    location / {
        default_type text/plain;
        return 404 "extra-gateway: unknown path\n";
    }
}
