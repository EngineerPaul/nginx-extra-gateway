# Шлюз /extra — раздача подсервисов по продолжению пути.
# Пример: /extra/blank — заглушка; позже /extra/analysis → другой upstream.

server {
    listen 80;
    server_name _;

    # Заглушка для проверки цепочки: браузер → diary nginx → extra_nginx
    location = /extra/blank {
        default_type text/html;
        alias /usr/share/nginx/html/extra/blank.html;
    }

    location = /extra/blank/ {
        return 301 /extra/blank;
    }

    # Заготовка под будущие сервисы:
    # location /extra/analysis/ {
    #     proxy_pass http://analysis:8000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location / {
        default_type text/plain;
        return 404 "extra-gateway: unknown path\n";
    }
}
