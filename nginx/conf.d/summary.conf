# Summary — отдельный compose-проект в сети extra_services.
# DNS-имена = container_name из summary compose (summary_frontend / summary_backend).


location /extra/summary/ {
    proxy_pass http://summary:8000/extra/summary/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /extra/summary {
    return 301 /extra/summary/;
}
