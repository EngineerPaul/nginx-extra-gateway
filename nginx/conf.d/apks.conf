# Страница скачивания APK. Файлы лежат в nginx/apks (в образе: /usr/share/nginx/apks).

location = /extra/apks {
    return 301 /extra/apks/;
}

location = /extra/apks/ {
    default_type text/html;
    root /usr/share/nginx/html;
    try_files /extra/apks.html =404;
}

location /extra/apks/files/ {
    alias /usr/share/nginx/apks/;
    default_type application/octet-stream;
    types {
        application/vnd.android.package-archive apk;
        image/png png;
        image/jpeg jpg jpeg;
        image/gif gif;
        image/webp webp;
    }
    add_header Content-Disposition "attachment";
}
