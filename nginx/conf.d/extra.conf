# Индекс /extra — страница со списком встроенных сервисов.
# Не использовать alias на файл при location = /extra/ — у nginx это даёт 500.

location = /extra {
    return 301 /extra/;
}

location = /extra/ {
    default_type text/html;
    root /usr/share/nginx/html;
    try_files /extra/extra.html =404;
}
