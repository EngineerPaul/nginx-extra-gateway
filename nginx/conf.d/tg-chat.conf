# Tg-chat — отдельный compose-проект в сети extra_services.
# DNS-имена = container_name - chat.

# WebSocket-путь для работы с чатом.
location /extra/chat/api/ws {
    proxy_pass http://chat:80/extra/chat/api/ws;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}


location /extra/chat/ {
    proxy_pass http://chat:80/extra/chat/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade; # Передаёт на чат заголовок, которым браузер просит превратить HTTP в WebSocket.
    proxy_set_header Connection "upgrade"; # Говорит прокси не закрывать запрос как обычную страницу, а оставить длинный сокет. Работает вместе со строкой выше.
    proxy_read_timeout 3600s; # Увеличивает таймауты для чтения и отправки данных.
    proxy_send_timeout 3600s; # Увеличивает таймауты для чтения и отправки данных.
    proxy_buffering off; # Отключает буферизацию данных.
    client_max_body_size 64m; # Разрешает тело запроса до 64 МБ. Иначе хостовый nginx отрежет загрузку файлов
}

location = /extra/chat {
    return 301 /extra/chat/;
}
