# sda-marketing — отдельный compose-проект в сети extra_services.
# DNS-имя = container_name (marketing).

location /extra/marketing/ {
    proxy_pass http://sdamarketing:8000/extra/marketing/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /extra/marketing {
    return 301 /extra/marketing/;
}
