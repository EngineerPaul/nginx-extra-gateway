# CI-only: без analysis (upstream-контейнеров в CI нет).
# Подключается через .github/docker-compose.ci.yaml.

server {
    listen 80;
    server_name _;

    location = /extra/blank {
        default_type text/html;
        alias /usr/share/nginx/html/extra/blank.html;
    }

    location = /extra/blank/ {
        return 301 /extra/blank;
    }

    location / {
        default_type text/plain;
        return 404 "extra-gateway: unknown path\n";
    }
}
